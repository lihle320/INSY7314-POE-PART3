name: VS Code Project CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Verify project structure
      id: project-check
      run: |
        echo "Checking project files..."
        if [ -f "package.json" ]; then
          echo "package.json found"
          echo "has-package-json=true" >> $GITHUB_OUTPUT
        else
          echo "package.json not found"
          echo "has-package-json=false" >> $GITHUB_OUTPUT
        fi
        
        if [ -f "package-lock.json" ] || [ -f "yarn.lock" ] || [ -f "npm-shrinkwrap.json" ]; then
          echo "Lock file found"
          echo "has-lock-file=true" >> $GITHUB_OUTPUT
        else
          echo "No lock file found"
          echo "has-lock-file=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Setup Node.js
      if: steps.project-check.outputs.has-package-json == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: ${{ steps.project-check.outputs.has-lock-file == 'true' && 'npm' || '' }}
    
    - name: Install dependencies
      if: steps.project-check.outputs.has-package-json == 'true'
      run: |
        if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
          echo "Using npm ci with lock file"
          npm ci
        elif [ -f "yarn.lock" ]; then
          echo "Using yarn install"
          yarn install --frozen-lockfile
        else
          echo "No lock file found, using npm install"
          npm install
        fi
    
    - name: Run available scripts
      if: steps.project-check.outputs.has-package-json == 'true'
      run: |
        # Check and run linting if available
        if npm run | grep -q "lint"; then
          npm run lint
        else
          echo "No lint script found"
        fi
        
        # Check and run tests if available
        if npm run | grep -q "test"; then
          npm test
        else
          echo "No test script found"
        fi
        
        # Check and run build if available
        if npm run | grep -q "build"; then
          npm run build
        else
          echo "No build script found"
        fi
    
    - name: Project status
      if: steps.project-check.outputs.has-package-json == 'false'
      run: echo "This doesn't appear to be a Node.js project or package.json is missing"
