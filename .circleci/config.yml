# Use the latest 2.1 version of CircleCI pipeline process engine.
version: 2.1

# Reusable commands
commands:
  setup-environment:
    steps:
      - checkout
      - run:
          name: Setup environment variables
          command: |
            echo 'export BUILD_TIMESTAMP=$(date +%Y%m%d_%H%M%S)' >> $BASH_ENV
            echo 'export COMMIT_SHA_SHORT=${CIRCLE_SHA1:0:7}' >> $BASH_ENV
            source $BASH_ENV

  security-checks:
    steps:
      - run:
          name: Run security baseline checks
          command: |
            echo "Running security baseline checks..."
            # Check for suspicious file permissions
            find . -name "*.key" -o -name "*.pem" -o -name "*.crt" | while read file; do
              perms=$(stat -c "%a" "$file")
              if [ "$perms" -gt 600 ]; then
                echo "WARNING: Insecure permissions ($perms) on $file"
              fi
            done

# Orbs for reusable functionality
orbs:
  node: circleci/node@5.0
  python: circleci/python@2.1
  sonarcloud: sonarsource/sonarcloud@1.0

# Define jobs
jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - setup-environment
      - run:
          name: "Install dependencies"
          command: |
            echo "Installing project dependencies..."
      - run:
          name: "Run unit tests"
          command: "echo Running unit test suite..."
      - run:
          name: "Build project"
          command: "echo Building application..."
      - persist_to_workspace:
          root: .
          paths:
            - .

  sast-scan:
    docker:
      - image: cimg/go:current
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install SAST tools
          command: |
            echo "Installing SAST tools..."
            python -m pip install semgrep
            go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
            pip install bandit
            npm install -g eslint eslint-plugin-security
      - run:
          name: Run Semgrep SAST scan
          command: |
            echo "Running Semgrep security scan..."
            semgrep --config=auto --error || true
      - run:
          name: Run language-specific SAST tools
          command: |
            if [ -f "package.json" ]; then
              echo "Running ESLint security scan..."
              npx eslint --config .eslintrc.security.js . || true
            fi
            if [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
              echo "Running Bandit security scan..."
              bandit -r . -f json -o bandit-report.json || true
            fi
            if [ -f "go.mod" ]; then
              echo "Running Gosec security scan..."
              ~/go/bin/gosec ./... || true
            fi
      - store_artifacts:
          path: bandit-report.json
          destination: sast-reports

  sca-scan:
    docker:
      - image: cimg/node:current
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install SCA tools
          command: |
            echo "Installing SCA tools..."
            npm install -g @cyclonedx/bom
            wget -q -O dependency-check.zip https://github.com/jeremylong/DependencyCheck/releases/download/v8.2.1/dependency-check-8.2.1-release.zip
            unzip dependency-check.zip
      - run:
          name: Generate Software Bill of Materials (SBOM)
          command: |
            echo "Generating SBOM..."
            if [ -f "package.json" ]; then
              npx @cyclonedx/bom . --output sbom.json
            fi
      - run:
          name: Run OWASP Dependency Check
          command: |
            echo "Running OWASP Dependency Check..."
            ./dependency-check/bin/dependency-check.sh \
              --scan . \
              --format HTML \
              --format JSON \
              --out dependency-report \
              --project "MyApp" \
              --enableExperimental || true
      - run:
          name: Run npm audit
          command: |
            if [ -f "package.json" ]; then
              echo "Running npm audit..."
              npm audit --audit-level moderate || true
            fi
      - store_artifacts:
          path: sbom.json
          destination: sca-reports
      - store_artifacts:
          path: dependency-report
          destination: sca-reports

  sonarqube:
    working_directory: ~/build
    docker:
      - image: sonarsource/sonar-scanner-cli:latest
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Validate SonarCloud configuration
          command: |
            if [ -z "$SONAR_ORG" ]; then
              echo "ERROR: SONAR_ORG environment variable is not set"
              exit 1
            fi
            if [ -z "$SONAR_PROJECT_KEY" ]; then
              echo "ERROR: SONAR_PROJECT_KEY environment variable is not set"
              exit 1
            fi
            if [ -z "$SONAR_TOKEN" ]; then
              echo "ERROR: SONAR_TOKEN environment variable is not set"
              exit 1
            fi
            echo "SonarCloud configuration validated successfully"
      - run:
          name: Run SonarCloud Scanner
          command: |
            if [ "$CIRCLE_BRANCH" == "main" ] || [ "$CIRCLE_BRANCH" == "master" ]; then
              SONAR_BRANCH="$CIRCLE_BRANCH"
            else
              SONAR_BRANCH="$CIRCLE_BRANCH"
            fi

            echo "Sonar branch value is: $SONAR_BRANCH"
            echo "Sonar org value is: $SONAR_ORG"
            echo "Sonar project key is: $SONAR_PROJECT_KEY"

            max_retries=3
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              sonar-scanner \
                -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
                -Dsonar.organization="$SONAR_ORG" \
                -Dsonar.host.url="https://sonarcloud.io" \
                -Dsonar.exclusions="**/android/**,**/ios/**,**/node_modules/**,**/vendor/**,**/dist/**" \
                -Dsonar.login="$SONAR_TOKEN" \
                -Dsonar.branch.name="$SONAR_BRANCH" \
                -Dsonar.scm.provider=git \
                -Dsonar.sourceEncoding=UTF-8 \
                -Dsonar.coverage.exclusions="**/test/**,**/spec/**,**/*.test.js" \
                -Dsonar.cpd.exclusions="**/node_modules/**,**/vendor/**"
              
              if [ $? -eq 0 ]; then
                echo "SonarQube analysis completed successfully"
                break
              else
                retry_count=$((retry_count + 1))
                echo "SonarQube analysis failed, retry $retry_count of $max_retries in 10 seconds..."
                if [ $retry_count -lt $max_retries ]; then
                  sleep 10
                fi
              fi
            done
            
            if [ $retry_count -eq $max_retries ]; then
              echo "SonarQube analysis failed after $max_retries attempts"
              exit 1
            fi

  api-security-test:
    docker:
      - image: cimg/python:current
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install API security testing tools
          command: |
            pip install zapcli
            wget -q -O zap.tar.gz https://github.com/zaproxy/zaproxy/releases/download/v2.12.0/ZAP_2.12.0_Linux.tar.gz
            tar -xzf zap.tar.gz
      - run:
          name: Run API security scans
          command: |
            echo "Starting API security testing..."
            if [ -n "$API_BASE_URL" ]; then
              echo "Running ZAP baseline scan against $API_BASE_URL"
              ./ZAP_2.12.0/zap-baseline.py -t "$API_BASE_URL" -I -j -T 5 || true
            fi
      - store_artifacts:
          path: zap-report.html
          destination: api-security-reports

  ssl-security-test:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Install SSL testing tools
          command: |
            apt-get update && apt-get install -y openssl sslscan
            pip install sslyze
      - run:
          name: Run SSL/TLS security checks
          command: |
            echo "Running SSL/TLS security checks..."
            if [ -n "$APP_DOMAIN" ]; then
              echo "Testing SSL configuration for $APP_DOMAIN"
              sslscan "$APP_DOMAIN" > sslscan-report.txt
              sslyze --regular "$APP_DOMAIN" > sslyze-report.txt
              openssl s_client -connect "$APP_DOMAIN":443 -servername "$APP_DOMAIN" < /dev/null 2>/dev/null | openssl x509 -noout -text | grep -A1 "Subject Alternative Name" || true
            fi
      - store_artifacts:
          path: sslscan-report.txt
          destination: ssl-reports
      - store_artifacts:
          path: sslyze-report.txt
          destination: ssl-reports

  integration-test:
    docker:
      - image: cimg/node:current
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run integration tests
          command: |
            echo "Running integration tests..."
      - run:
          name: Security integration tests
          command: |
            echo "Running security-focused integration tests..."
      - store_artifacts:
          path: test-results
          destination: integration-test-results

  security-summary:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Generate security summary report
          command: |
            cat << EOF > security-summary.txt
            === SECURITY TESTING SUMMARY ===
            Build: $CIRCLE_BUILD_NUM
            Commit: $CIRCLE_SHA1
            Branch: $CIRCLE_BRANCH
            Timestamp: $(date)
            
            Security Tests Completed:
            ✓ SAST (Static Application Security Testing)
            ✓ SCA (Software Composition Analysis)  
            ✓ SonarQube Quality Gate
            ✓ API Security Testing
            ✓ SSL/TLS Security Checks
            ✓ Integration Security Tests
            
            Artifacts Available:
            - SAST Reports: CircleCI Artifacts tab
            - SCA Reports: CircleCI Artifacts tab
            - SonarQube Dashboard: https://sonarcloud.io
            - SSL Security Reports: CircleCI Artifacts tab
            EOF
            echo "Security summary generated:"
            cat security-summary.txt
      - store_artifacts:
          path: security-summary.txt
          destination: security-reports

# Orchestrate jobs using workflows
workflows:
  comprehensive-security-scan:
    jobs:
      - build
      - sast-scan:
          requires:
            - build
      - sca-scan:
          requires:
            - build
      - sonarqube:
          requires:
            - build
      - api-security-test:
          requires:
            - build
      - ssl-security-test:
          requires:
            - build
      - integration-test:
          requires:
            - build
      - security-summary:
          requires:
            - sast-scan
            - sca-scan
            - sonarqube
            - api-security-test
            - ssl-security-test
            - integration-test

  security-fast-feedback:
    jobs:
      - build
      - sast-scan:
          requires:
            - build
      - sca-scan:
          requires:
            - build
      - security-summary:
          requires:
            - sast-scan
            - sca-scan

  nightly-full-scan:
    triggers:
      - schedule:
          cron: "0 2 * * *"
          filters:
            branches:
              only:
                - main
                - master
    jobs:
      - build
      - sast-scan
      - sca-scan
      - sonarqube
      - api-security-test
      - ssl-security-test
      - integration-test
      - security-summary
